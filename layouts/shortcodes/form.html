<form action="https://web3forms.com" method="POST" class="contact-form">
  <!-- Pulls the access key dynamically from the shortcode or config -->
  <input type="hidden" name="access_key" value="{{ .Get "key" | default site.Params.web3forms_key }}">
  
  <div class="form-group">
    <label for="name">{{ .Get "label_name" | default "Name" }}</label>
    <input type="text" id="name" name="name" required>
  </div>
  
  <div class="form-group">
    <label for="email">{{ .Get "label_email" | default "Email" }}</label>
    <input type="email" id="email" name="email" required>
  </div>
  
  <div class="form-group">
    <label for="message">{{ .Get "label_message" | default "Message" }}</label>
    <textarea id="message" name="message" required></textarea>
  </div>
  
  <div class="form-group">
    <button type="submit">{{ .Get "label_button" | default "Submit Form" }}</button>
  </div>
  
  <!-- Optional Redirect Page -->
  <!--
  {{ if .Get "redirect" }}
  <input type="hidden" name="redirect" value="{{ .Get "redirect" }}">
  {{ end }}
  -->
  
</form>
